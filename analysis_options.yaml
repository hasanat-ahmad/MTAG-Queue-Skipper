# Static analysis for the Flutter app. Run with `flutter analyze`.
#
# On top of the recommended Flutter lints, these rules encode the project's
# conventions (see docs/ARCHITECTURE.md):
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Imports: package: URIs only, sorted (dart:, package:, relative).
    - always_use_package_imports
    - directives_ordering
    # Async work is awaited or explicitly marked with unawaited(...).
    - unawaited_futures
    - cancel_subscriptions
    # Logging goes through debugPrint, not print.
    - avoid_print
    - prefer_final_fields

analyzer:
  exclude:
    # Gitignored local key files.
    - lib/config/*.local.dart
